<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CVCase — Build your CV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f8fafc; margin:0; }
  #chatLog { scroll-behavior: smooth; }
  .msg-bubble { max-width: 82%; }
  .typing-dot { animation: blink 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  #cropperOverlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; display:none; align-items:center; justify-content:center; flex-direction:column; }
  #cropCanvas { touch-action:none; background:#111; border-radius:8px; }
</style>
</head>
<body class="h-screen flex flex-col">

  <!-- ── Dev-only lock screen — shown to everyone except the allowed test account ── -->
  <div id="lockScreen" class="hidden fixed inset-0 z-50 bg-white flex flex-col items-center justify-center px-8 text-center">
    <div class="w-14 h-14 rounded-full bg-indigo-50 flex items-center justify-center mb-4">
      <svg class="w-7 h-7 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
    </div>
    <p class="text-base font-bold text-gray-800 mb-1">CV Builder is coming soon</p>
    <p class="text-sm text-gray-500 max-w-xs">This feature is still being built and tested. It'll be available to everyone soon!</p>
    <button onclick="window.location.href='app.html'" class="mt-6 text-sm font-bold text-indigo-600 px-5 py-2 rounded-full border border-indigo-200 hover:bg-indigo-50">Back to app</button>
  </div>

  <div id="cvApp" class="hidden h-screen flex flex-col">

  <!-- ── Top bar ─────────────────────────────────────────────────────── -->
  <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-200 flex-shrink-0">
    <button onclick="window.location.href='app.html'" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-indigo-600" aria-label="Back">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">CV</div>
    <div>
      <p class="text-sm font-bold text-gray-800">CVCase <span class="text-[10px] font-bold text-amber-500 align-middle">DEV</span></p>
      <p class="text-[11px] text-gray-400">Minimal / Scandinavian template</p>
    </div>
  </div>

  <!-- ── Chat log ────────────────────────────────────────────────────── -->
  <div id="chatLog" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

  <!-- ── PDF preview strip (shown once a preview/final PDF exists) ──── -->
  <div id="pdfPreviewBar" class="hidden border-t border-gray-200 bg-white px-4 py-2 flex items-center gap-3">
    <span id="pdfPreviewLabel" class="text-xs font-semibold text-gray-500 flex-1">Preview ready</span>
    <a id="pdfPreviewOpenBtn" target="_blank" class="text-xs font-bold text-indigo-600 px-3 py-1.5 rounded-full border border-indigo-200 hover:bg-indigo-50">Open PDF</a>
    <a id="pdfPreviewDownloadBtn" class="text-xs font-bold text-white bg-indigo-600 px-3 py-1.5 rounded-full hover:bg-indigo-700">Download</a>
  </div>

  <!-- ── Composer ────────────────────────────────────────────────────── -->
  <div class="border-t border-gray-200 bg-white px-3 py-2.5 flex-shrink-0">
    <div id="pendingFilesRow" class="hidden flex-wrap gap-2 mb-2"></div>
    <div class="flex items-end gap-2">
      <button onclick="document.getElementById('fileInput').click()" class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200" title="Attach document or photo">
        <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" class="hidden" accept="image/*,.pdf" multiple onchange="handleFilesSelected(event)">
      <textarea id="composerInput" rows="1" placeholder="Message CVCase…"
        class="flex-1 resize-none border border-gray-200 rounded-2xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
        onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
      <button onclick="sendMessage()" id="sendBtn" class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-full bg-indigo-600 text-white hover:bg-indigo-700 disabled:opacity-40" title="Send">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2.94 2.94a1.5 1.5 0 011.66-.32l13 5.5a1.5 1.5 0 010 2.76l-13 5.5A1.5 1.5 0 012 14.94l1.2-4.8a1 1 0 01.8-.75L9 9l-5-.4a1 1 0 01-.8-.75L2 2.94z"/></svg>
      </button>
    </div>
  </div>

  </div><!-- /#cvApp -->

  <!-- ── Photo cropper overlay (frame matches the template's exact circle) ── -->
  <div id="cropperOverlay">
    <p class="text-white text-sm font-semibold mb-3">Position your photo inside the circle</p>
    <canvas id="cropCanvas" width="320" height="320"></canvas>
    <div class="flex items-center gap-3 mt-3">
      <input type="range" id="zoomSlider" min="100" max="300" value="100" class="w-48">
      <button onclick="confirmCrop()" class="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-full">Use this photo</button>
      <button onclick="cancelCrop()" class="text-white text-sm px-3 py-2">Cancel</button>
    </div>
  </div>

<script>
  // ── DEV ACCESS GATE ──────────────────────────────────────────────────────
  // While this feature is being built, only this one account can open it.
  // This is a convenience gate for everyone else (clean "coming soon"
  // screen) — the REAL enforcement is server-side in cv-chat.js, which
  // independently checks the same phone number and refuses to respond to
  // anyone else even if they somehow reach this page.
  const CV_DEV_ALLOWED_USER_ID = '0985576139';
  const currentUserId = localStorage.getItem('cv_userId');

  if (currentUserId !== CV_DEV_ALLOWED_USER_ID) {
    document.getElementById('lockScreen').classList.remove('hidden');
  } else {
    document.getElementById('cvApp').classList.remove('hidden');
  }

  // ── State ──────────────────────────────────────────────────────────────
  let conversationMessages = []; // Anthropic-format message history, sent back each turn
  let pendingFiles = [];         // files attached to the NEXT outgoing message
  let photoBase64 = null;        // cropped circular photo, once confirmed
  let cropSourceImage = null;
  let cropZoom = 1, cropOffsetX = 0, cropOffsetY = 0, cropDragging = false, cropLastX = 0, cropLastY = 0;

  function scrollChatToBottom() {
    const log = document.getElementById('chatLog');
    log.scrollTop = log.scrollHeight;
  }

  function addBubble(role, text, isTyping) {
    const log = document.getElementById('chatLog');
    const wrap = document.createElement('div');
    wrap.className = 'flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble rounded-2xl px-4 py-2.5 text-sm leading-relaxed ' +
      (role === 'user' ? 'bg-indigo-600 text-white rounded-br-md' : 'bg-white border border-gray-200 text-gray-700 rounded-bl-md');
    if (isTyping) {
      bubble.innerHTML = '<span class="typing-dot">●</span> <span class="typing-dot">●</span> <span class="typing-dot">●</span>';
      bubble.id = 'typingBubble';
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    scrollChatToBottom();
    return wrap;
  }

  function removeTypingBubble() {
    const el = document.getElementById('typingBubble');
    if (el) el.closest('.flex').remove();
  }

  // ── File handling ─────────────────────────────────────────────────────
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function handleFilesSelected(event) {
    const files = Array.from(event.target.files || []);
    for (const file of files) {
      if (file.type.startsWith('image/')) {
        // Any image attached is treated as a potential profile photo — open
        // the cropper sized to the Minimal template's exact circle so what
        // the user frames is a 1:1 match, no AI reinterpretation involved.
        openCropper(file);
      } else {
        const base64 = await fileToBase64(file);
        pendingFiles.push({ filename: file.name, mediaType: file.type || 'application/pdf', base64 });
        renderPendingFiles();
      }
    }
    event.target.value = '';
  }

  function renderPendingFiles() {
    const row = document.getElementById('pendingFilesRow');
    row.innerHTML = '';
    if (!pendingFiles.length) { row.classList.add('hidden'); return; }
    row.classList.remove('hidden');
    pendingFiles.forEach((f, i) => {
      const chip = document.createElement('div');
      chip.className = 'flex items-center gap-1.5 bg-gray-100 text-gray-600 text-[11px] px-2.5 py-1 rounded-full';
      chip.innerHTML = `<span>📄 ${f.filename}</span>`;
      const x = document.createElement('button');
      x.textContent = '✕';
      x.className = 'text-gray-400 hover:text-gray-700';
      x.onclick = () => { pendingFiles.splice(i, 1); renderPendingFiles(); };
      chip.appendChild(x);
      row.appendChild(chip);
    });
  }

  // ── Photo cropper — circle matches Minimal template's PHOTO_R exactly ──
  // (The template draws a 64pt-diameter circle; the cropper below just
  // needs the same ASPECT — a perfect circle — the actual output is
  // exported at a fixed square resolution regardless of on-screen size.)
  function openCropper(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      cropSourceImage = new Image();
      cropSourceImage.onload = () => {
        cropZoom = 1; cropOffsetX = 0; cropOffsetY = 0;
        document.getElementById('zoomSlider').value = 100;
        document.getElementById('cropperOverlay').style.display = 'flex';
        drawCropCanvas();
      };
      cropSourceImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function drawCropCanvas() {
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    ctx.clip();
    const img = cropSourceImage;
    const baseScale = Math.max(size / img.width, size / img.height) * cropZoom;
    const w = img.width * baseScale, h = img.height * baseScale;
    ctx.drawImage(img, size / 2 - w / 2 + cropOffsetX, size / 2 - h / 2 + cropOffsetY, w, h);
    ctx.restore();
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2 - 1.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
    cropZoom = Number(e.target.value) / 100;
    drawCropCanvas();
  });
  const cropCanvasEl = document.getElementById('cropCanvas');
  cropCanvasEl.addEventListener('pointerdown', (e) => { cropDragging = true; cropLastX = e.clientX; cropLastY = e.clientY; });
  window.addEventListener('pointerup', () => cropDragging = false);
  window.addEventListener('pointermove', (e) => {
    if (!cropDragging) return;
    cropOffsetX += (e.clientX - cropLastX);
    cropOffsetY += (e.clientY - cropLastY);
    cropLastX = e.clientX; cropLastY = e.clientY;
    drawCropCanvas();
  });

  function confirmCrop() {
    const canvas = document.getElementById('cropCanvas');
    // Export as a modest fixed-size square JPEG — plenty for a small print circle.
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = 400; exportCanvas.height = 400;
    exportCanvas.getContext('2d').drawImage(canvas, 0, 0, 400, 400);
    photoBase64 = exportCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
    document.getElementById('cropperOverlay').style.display = 'none';
    addBubble('assistant', "Got your photo — I'll use it exactly as you framed it, no edits.");
  }
  function cancelCrop() {
    document.getElementById('cropperOverlay').style.display = 'none';
    cropSourceImage = null;
  }

  // ── Sending messages to cv-chat.js ──────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('composerInput');
    const text = input.value.trim();
    if (!text && !pendingFiles.length) return;

    if (text) addBubble('user', text);
    pendingFiles.forEach(f => addBubble('user', `📄 ${f.filename}`));
    input.value = '';
    const filesToSend = pendingFiles.slice();
    pendingFiles = [];
    renderPendingFiles();

    document.getElementById('sendBtn').disabled = true;
    addBubble('assistant', '', true);

    try {
      const res = await fetch('/.netlify/functions/cv-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: currentUserId, // checked again server-side — see cv-chat.js
          messages: conversationMessages,
          newUserText: text || undefined,
          newUserFiles: filesToSend.length ? filesToSend : undefined,
          photoBase64: photoBase64 || undefined
        })
      });
      const data = await res.json();
      removeTypingBubble();

      if (!res.ok || !data.success) {
        addBubble('assistant', 'Sorry, something went wrong: ' + (data.error || 'unknown error'));
        return;
      }

      conversationMessages = data.messages;
      addBubble('assistant', data.reply || '(no reply)');

      if (data.previewPdfBase64) showPdfBar(data.previewPdfBase64, 'Preview ready', 'cv_preview.pdf');
      if (data.finalPdfBase64) showPdfBar(data.finalPdfBase64, 'Your CV is ready 🎉', 'cv_final.pdf');

    } catch (e) {
      removeTypingBubble();
      addBubble('assistant', 'Network error — please check your connection and try again.');
    } finally {
      document.getElementById('sendBtn').disabled = false;
    }
  }

  function showPdfBar(base64, label, filename) {
    const bar = document.getElementById('pdfPreviewBar');
    const blob = base64ToBlob(base64, 'application/pdf');
    const url = URL.createObjectURL(blob);
    document.getElementById('pdfPreviewLabel').textContent = label;
    document.getElementById('pdfPreviewOpenBtn').href = url;
    const dl = document.getElementById('pdfPreviewDownloadBtn');
    dl.href = url;
    dl.setAttribute('download', filename);
    bar.classList.remove('hidden');
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNumbers)], { type: mime });
  }

  // ── Kick off the conversation ────────────────────────────────────────
  if (currentUserId === CV_DEV_ALLOWED_USER_ID) {
    addBubble('assistant', "Hi! I'm CVCase 👋 I'll help you build a clean, one-page CV using the Minimal template. You can tell me about yourself here, or attach a document (old CV, transcript, certificate) and I'll pull details from it. Whenever you're ready, attach a photo too and I'll let you frame it perfectly for this template.");
  }
</script>
</body>
</html>

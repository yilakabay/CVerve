<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Same brand override as app.html — Telegram-style blue mapped onto the
  // "indigo" scale, so every indigo-* utility class below matches the rest
  // of the app automatically, and dark mode is class-based (not OS-based)
  // so it can follow Telegram's own theme setting.
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          indigo: {
            50:  '#EBF7FC', 100: '#D9F0FA', 200: '#B3E1F5', 300: '#80D0F0',
            400: '#4DBEEA', 500: '#17A6E0', 600: '#0088CC', 700: '#006999',
            800: '#004D70', 900: '#003A55',
          },
        },
      },
    },
  };
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // ── Theme detection — identical logic to app.html ──
  (function () {
    function applyTheme(isDark) { document.documentElement.classList.toggle('dark', !!isDark); }
    var tg = window.Telegram && window.Telegram.WebApp;
    var inTelegram = !!(tg && tg.initData);
    if (inTelegram) {
      applyTheme(tg.colorScheme === 'dark');
      tg.onEvent('themeChanged', function () { applyTheme(tg.colorScheme === 'dark'); });
    } else {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      applyTheme(mq.matches);
      if (mq.addEventListener) mq.addEventListener('change', function (e) { applyTheme(e.matches); });
      else if (mq.addListener) mq.addListener(function (e) { applyTheme(e.matches); });
    }
  })();
</script>
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f8fafc; margin:0; }
  html.dark body { background:#1e1e21; }
  #chatLog { scroll-behavior: smooth; }
  .msg-bubble { max-width: 82%; }
  #cropperOverlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200; display:none; align-items:center; justify-content:center; flex-direction:column; }
  #cropCanvas { touch-action:none; background:#111; border-radius:8px; }

  /* Brand logo mark — solid fill normally; switches to a self-drawing
     outline while CVCase is thinking, via the .thinking class toggle. */
  .logo-mark path { fill: #0088CC; stroke: none; transition: fill 0.2s; }
  .logo-mark.thinking path {
    fill: none;
    stroke: #0088CC;
    stroke-width: 6;
    stroke-dasharray: var(--logo-draw-len, 3000);
    stroke-dashoffset: var(--logo-draw-len, 3000);
    animation: logoDrawEraseCv 1.8s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  @keyframes logoDrawEraseCv {
    0%   { stroke-dashoffset: var(--logo-draw-len, 3000); }
    42%  { stroke-dashoffset: 0; }
    58%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: calc(-1 * var(--logo-draw-len, 3000)); }
  }
</style>

<script>
  // ── DEV ACCESS GATE ──────────────────────────────────────────────────────
  // While this feature is being built, only this one account can open it.
  // This is a convenience gate for everyone else (clean "coming soon"
  // screen) — the REAL enforcement is server-side in cv-chat.js, which
  // independently checks the same phone number and refuses to respond to
  // anyone else even if they somehow reach this page.
  const CV_DEV_ALLOWED_USER_ID = '0985576139';
  const currentUserId = localStorage.getItem('cv_userId');

  if (currentUserId !== CV_DEV_ALLOWED_USER_ID) {
    document.getElementById('lockScreen').classList.remove('hidden');
  } else {
    document.getElementById('cvApp').classList.remove('hidden');
  }

  // ── State ──────────────────────────────────────────────────────────────
  let conversationMessages = []; // Anthropic-format message history, sent back each turn
  let pendingFiles = [];         // files attached to the NEXT outgoing message
  let photoBase64 = null;        // cropped circular photo, once confirmed
  let cropSourceImage = null;
  let cropZoom = 1, cropOffsetX = 0, cropOffsetY = 0, cropDragging = false, cropLastX = 0, cropLastY = 0;
  let lastLogoMarkEl = null; // the ONE logo element — moved and re-animated, never recreated

  // Single brand mark used for BOTH states: solid (sitting under the latest
  // finished reply) and animated (drawing itself while CVCase "thinks").
  // Sending a new message pulls this same element down to the bottom of
  // the chat and switches it into its drawing animation; when the reply
  // arrives, it settles back to solid, right under the new reply.
  const LOGO_MARK_SVG = `<svg class="logo-mark" viewBox="278 288 562 342" style="width:28px;height:auto;display:block;">
    <path class="logo-mark-path" d="M438.71 298.43C451.9 297.2 465.27 297.76 478.5 297.76C499.5 297.76 520.5 297.75 541.5 297.76C552.72 297.77 572.7 295.66 569.76 313.43C568.97 318.25 565.64 322.6 563.32 326.79C558.34 335.78 553.12 344.7 548.34 353.8C546.1 358.07 543.38 366.25 538.75 368.3C533.82 370.5 517.64 369.11 511.5 369.1C490.23 369.06 468.74 368.24 447.5 369.24C395.96 371.66 357.98 416.6 361.71 467.5C365.17 514.61 404.06 549.67 450.54 551.57C466.47 552.22 482.56 551.72 498.5 551.66C503.64 551.64 514.83 550.26 519.23 552.32C522.34 553.77 527.38 563.76 529.56 566.93C536.1 576.45 542.37 586.2 548.54 595.97C550.32 598.79 552.64 601.46 553.91 604.57C556.8 611.7 553.74 619.31 546.44 621.93C539.65 624.36 530.63 622.88 523.5 622.88C508.17 622.88 492.83 622.88 477.5 622.89C461.52 622.9 445.33 623.56 429.5 620.92C386.28 613.73 347.25 589.26 322.12 553.34C308.86 534.39 299.35 512.23 295.19 489.45C278.25 396.62 344.57 307.26 438.71 298.43Z"/>
    <path class="logo-mark-path" d="M830.97 297.5C830.37 304.39 821.83 314.33 817.93 320.38C806.81 337.61 795.88 354.95 784.53 372.03C762.12 405.73 740.57 440.02 718.41 473.87C702.45 498.25 685.98 522.36 670.58 547.09C659.13 565.47 647.04 583.56 635.11 601.64C630.33 608.88 626.27 619.04 617.47 622C611.35 624.05 604.83 622.75 599.98 618.52C597.08 616 595.43 612.37 593.33 609.21C588.25 601.55 583.7 593.55 578.55 585.94C569.35 572.35 561.11 558.08 552.26 544.26C536.88 520.27 521.45 496.33 506.37 472.15C500.61 462.91 494.91 453.6 489.01 444.45C486 439.78 481.77 435.21 482.22 429.5C485.51 425.48 489.61 425.76 494.5 425.72C501.83 425.66 509.17 425.75 516.5 425.74C528.04 425.74 539.43 424.63 549.75 430.72C559.92 436.71 564.65 448.15 570.73 457.75C580.71 473.49 590.23 489.53 600.39 505.14C604.13 510.88 607.14 517.46 611.5 522.71C615.92 518.28 618.87 512 622.22 506.71C627.64 498.17 633.12 489.65 638.63 481.16C662.54 444.33 685.46 406.83 709.73 370.25C717.2 359 724.34 347.54 731.75 336.26C736.8 328.56 741.31 320.95 747.97 314.47C765.03 297.85 785.49 293.48 808.5 293.3C815.1 293.25 827.17 290.83 830.97 297.5Z"/>
  </svg>`;

  // Creates the single logo mark element the first time it's needed.
  function ensureLogoMarkEl() {
    if (lastLogoMarkEl) return lastLogoMarkEl;
    const mark = document.createElement('div');
    mark.className = 'flex justify-start mt-1 mb-1';
    mark.innerHTML = LOGO_MARK_SVG;
    lastLogoMarkEl = mark;
    return mark;
  }

  // Moves the logo mark to the bottom of the chat (pulling it down past
  // whatever was just sent) and switches it into the drawing animation.
  function pullLogoDownAndAnimate() {
    const log = document.getElementById('chatLog');
    const mark = ensureLogoMarkEl();
    log.appendChild(mark); // appendChild on an existing node MOVES it
    mark.querySelector('.logo-mark').classList.add('thinking');
    initLogoDrawLength();
    scrollChatToBottom();
  }

  // Reply has arrived — stop the animation so the mark settles back to solid.
  function settleLogoMark() {
    if (lastLogoMarkEl) lastLogoMarkEl.querySelector('.logo-mark').classList.remove('thinking');
  }

  // Measure the real path length once so the dash animation traces the
  // exact outline instead of a rough guess (only needs to run once ever).
  let logoDrawLenSet = false;
  function initLogoDrawLength() {
    if (logoDrawLenSet) return;
    const p = document.querySelector('.logo-mark-path');
    if (p) {
      const len = p.getTotalLength();
      document.documentElement.style.setProperty('--logo-draw-len', len + 'px');
      logoDrawLenSet = true;
    }
  }

  function scrollChatToBottom() {
    const log = document.getElementById('chatLog');
    log.scrollTop = log.scrollHeight;
  }

  // Textarea grows with content (up to max-h-40 set in its class) instead
  // of clipping/hiding text on new lines.
  function autoGrowComposer(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // Relative time labels ("Just now", "1 minute ago", "2 hours ago", ...)
  // — never a real clock time/date, per spec.
  function formatRelativeTime(ts) {
    const diffMs = Date.now() - ts;
    const sec = Math.floor(diffMs / 1000);
    if (sec < 60) return 'Just now';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' minute' + (min > 1 ? 's' : '') + ' ago';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' hour' + (hr > 1 ? 's' : '') + ' ago';
    const day = Math.floor(hr / 24);
    if (day < 7) return day + ' day' + (day > 1 ? 's' : '') + ' ago';
    if (day < 30) { const wk = Math.floor(day / 7); return wk + ' week' + (wk > 1 ? 's' : '') + ' ago'; }
    if (day < 365) { const mo = Math.floor(day / 30); return mo + ' month' + (mo > 1 ? 's' : '') + ' ago'; }
    const yr = Math.floor(day / 365);
    return yr + ' year' + (yr > 1 ? 's' : '') + ' ago';
  }

  function refreshAllTimestamps() {
    document.querySelectorAll('.msg-timestamp').forEach(el => {
      el.textContent = formatRelativeTime(Number(el.dataset.ts));
    });
  }
  setInterval(refreshAllTimestamps, 30000); // labels like "1 minute ago" stay accurate over time

  // Small icon buttons shown under every message: copy (always active) and
  // retry (wired up afterward via setRetryHandler, since it needs to know
  // which "turn" — i.e. which original user input — to resend).
  const COPY_ICON = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>';
  const COPIED_ICON = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
  const RETRY_ICON = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>';

  function buildActionRow(text, align) {
    const row = document.createElement('div');
    row.className = 'flex items-center gap-2 mt-1 ' + (align === 'end' ? 'justify-end mr-1' : 'ml-0.5');

    const copyBtn = document.createElement('button');
    copyBtn.className = 'w-6 h-6 flex items-center justify-center rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 dark:hover:text-gray-200';
    copyBtn.innerHTML = COPY_ICON;
    copyBtn.title = 'Copy';
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.innerHTML = COPIED_ICON;
        setTimeout(() => { copyBtn.innerHTML = COPY_ICON; }, 1500);
      } catch (e) { /* clipboard unavailable — silently ignore */ }
    };

    const retryBtn = document.createElement('button');
    retryBtn.className = 'retry-btn hidden w-6 h-6 items-center justify-center rounded-md text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 dark:hover:text-gray-200';
    retryBtn.innerHTML = RETRY_ICON;
    retryBtn.title = 'Retry';

    row.appendChild(copyBtn);
    row.appendChild(retryBtn);
    return row;
  }

  // Reveals and wires up the retry button on a message wrap created by addBubble.
  function setRetryHandler(wrapEl, handler) {
    if (!wrapEl) return;
    const btn = wrapEl.querySelector('.retry-btn');
    if (!btn) return;
    btn.classList.remove('hidden');
    btn.classList.add('flex');
    btn.onclick = handler;
  }

  function addBubble(role, text, files) {
    const log = document.getElementById('chatLog');
    const wrap = document.createElement('div');
    const now = Date.now();

    if (role === 'user') {
      // Claude-style: user turns are a light, right-aligned rounded block —
      // not a big colored "chat bubble". If files were attached, they show
      // as a 2-column grid of square cards ABOVE the text (frozen at
      // whatever upload state they ended in — ready/failed), same square
      // shape as the composer's pending row, just no longer removable.
      wrap.className = 'flex flex-col items-end';

      if (files && files.length) {
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-2 mb-2 justify-items-end';
        files.forEach(entry => grid.appendChild(buildFileCard(entry, { removable: false, retryable: false })));
        wrap.appendChild(grid);
      }

      if (text) {
        const box = document.createElement('div');
        box.className = 'msg-bubble bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-2xl px-4 py-2.5 text-[15px] leading-relaxed whitespace-pre-wrap';
        box.textContent = text;
        wrap.appendChild(box);
      }

      const ts = document.createElement('div');
      ts.className = 'msg-timestamp text-[11px] text-gray-400 mt-1 mr-1';
      ts.dataset.ts = String(now);
      ts.textContent = formatRelativeTime(now);
      wrap.appendChild(ts);
      wrap.appendChild(buildActionRow(text || '', 'end'));
    } else {
      // Claude-style: assistant turns are plain text, flush to the left
      // edge, full width — no avatar repeated per message.
      wrap.className = 'flex flex-col items-start';
      const textEl = document.createElement('div');
      textEl.className = 'text-[15px] leading-relaxed text-gray-800 dark:text-gray-100 whitespace-pre-wrap w-full';
      textEl.textContent = text;
      wrap.appendChild(textEl);
      const ts = document.createElement('div');
      ts.className = 'msg-timestamp text-[11px] text-gray-400 mt-1 ml-0.5';
      ts.dataset.ts = String(now);
      ts.textContent = formatRelativeTime(now);
      wrap.appendChild(ts);
      wrap.appendChild(buildActionRow(text, 'start'));
    }

    log.appendChild(wrap);
    // The logo mark (if it already exists from a previous turn) was moved
    // to the bottom BEFORE this reply arrived (see pullLogoDownAndAnimate),
    // so it's currently sitting above the text we just added. Move it
    // again now so it settles back below the newest reply, where it belongs.
    if (role === 'assistant' && lastLogoMarkEl) log.appendChild(lastLogoMarkEl);
    scrollChatToBottom();
    return wrap;
  }

  // ── File handling ─────────────────────────────────────────────────────
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = () => reject(new Error('Could not read file'));
      r.readAsDataURL(file);
    });
  }

  // Set to true only when CVCase calls request_photo_upload (after the user
  // has approved the organized CV content). Until then, ANY image the user
  // attaches (a certificate photo, a transcript scan, etc.) must be treated
  // as a document, not a profile photo — opening the crop frame for those
  // would be confusing and wrong.
  let awaitingPhotoUpload = false;

  // pendingFiles entries: { id, filename, mediaType, base64, status, fileObj }
  // status: 'uploading' | 'ready' | 'failed'
  let pendingFileSeq = 0;

  async function handleFilesSelected(event) {
    const files = Array.from(event.target.files || []);
    for (const file of files) {
      if (file.type.startsWith('image/') && awaitingPhotoUpload) {
        // CVCase just asked for the photo — open the cropper sized to the
        // Minimal template's exact circle so what the user frames is a 1:1
        // match, no AI reinterpretation involved. Only one photo is needed,
        // so turn the flag back off once this happens.
        awaitingPhotoUpload = false;
        openCropper(file);
        continue;
      }
      // Either a non-image document, OR an image sent before CVCase asked
      // for a photo — in both cases, send it as a document for CVCase to
      // read (certificates/transcripts are very often photos too).
      const entry = { id: ++pendingFileSeq, filename: file.name, mediaType: file.type || 'application/pdf', base64: null, status: 'uploading', fileObj: file };
      pendingFiles.push(entry);
      renderPendingFiles();
      readFileIntoEntry(entry);
    }
    event.target.value = '';
  }

  async function readFileIntoEntry(entry) {
    entry.status = 'uploading';
    renderPendingFiles();
    try {
      entry.base64 = await fileToBase64(entry.fileObj);
      entry.status = 'ready';
    } catch (e) {
      entry.status = 'failed';
    }
    renderPendingFiles();
  }

  // File-type icon shown on each square card — a couple of simple, clearly
  // distinct glyphs rather than trying to render real thumbnails.
  function fileCardIcon(mediaType) {
    if (mediaType && mediaType.startsWith('image/')) {
      return '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 15l-5-5L5 21"/></svg>';
    }
    return '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/></svg>';
  }

  // Builds one square file card — reused both for the composer's pending
  // row (with a remove button + retry-on-fail) and for the sent message's
  // static grid (no remove button, status frozen at whatever it was when sent).
  function buildFileCard(entry, opts = {}) {
    const card = document.createElement('div');
    card.className = 'relative w-20 h-20 flex-shrink-0 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 flex flex-col items-center justify-center gap-1 px-1.5 overflow-hidden';

    const iconWrap = document.createElement('div');
    iconWrap.className = entry.status === 'failed' ? 'text-red-400' : 'text-gray-400';
    iconWrap.innerHTML = fileCardIcon(entry.mediaType);
    card.appendChild(iconWrap);

    const nameEl = document.createElement('div');
    nameEl.className = 'text-[9px] text-gray-500 dark:text-gray-400 text-center leading-tight w-full truncate px-0.5';
    nameEl.textContent = entry.filename;
    card.appendChild(nameEl);

    if (entry.status === 'uploading') {
      const overlay = document.createElement('div');
      overlay.className = 'absolute inset-0 bg-white/70 dark:bg-gray-900/70 flex items-center justify-center';
      overlay.innerHTML = '<div class="w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full animate-spin"></div>';
      card.appendChild(overlay);
    } else if (entry.status === 'failed') {
      const overlay = document.createElement('div');
      overlay.className = 'absolute inset-0 bg-white/85 dark:bg-gray-900/85 flex items-center justify-center';
      if (opts.retryable) {
        const retryBtn = document.createElement('button');
        retryBtn.className = 'text-[10px] font-bold text-red-500 underline';
        retryBtn.textContent = 'Retry';
        retryBtn.onclick = () => readFileIntoEntry(entry);
        overlay.appendChild(retryBtn);
      } else {
        overlay.innerHTML = '<span class="text-[10px] font-bold text-red-500">Failed</span>';
      }
      card.appendChild(overlay);
    }

    if (opts.removable) {
      const x = document.createElement('button');
      x.className = 'absolute top-0.5 right-0.5 w-4 h-4 rounded-full bg-gray-700/70 text-white text-[9px] flex items-center justify-center leading-none';
      x.textContent = '✕';
      x.onclick = () => { pendingFiles = pendingFiles.filter(f => f.id !== entry.id); renderPendingFiles(); };
      card.appendChild(x);
    }

    return card;
  }

  // Composer's pending-files strip: square cards laid out horizontally,
  // scrollable if there are more than fit on screen — Claude-style.
  function renderPendingFiles() {
    const row = document.getElementById('pendingFilesRow');
    row.innerHTML = '';
    if (!pendingFiles.length) { row.classList.add('hidden'); return; }
    row.classList.remove('hidden');
    pendingFiles.forEach(entry => {
      row.appendChild(buildFileCard(entry, { removable: true, retryable: true }));
    });
  }

  // ── Photo cropper — circle matches Minimal template's PHOTO_R exactly ──
  // (The template draws a 64pt-diameter circle; the cropper below just
  // needs the same ASPECT — a perfect circle — the actual output is
  // exported at a fixed square resolution regardless of on-screen size.)
  function openCropper(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      cropSourceImage = new Image();
      cropSourceImage.onload = () => {
        cropZoom = 1; cropOffsetX = 0; cropOffsetY = 0;
        document.getElementById('zoomSlider').value = 100;
        document.getElementById('cropperOverlay').style.display = 'flex';
        drawCropCanvas();
      };
      cropSourceImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function drawCropCanvas() {
    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    const size = canvas.width;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    ctx.clip();
    const img = cropSourceImage;
    const baseScale = Math.max(size / img.width, size / img.height) * cropZoom;
    const w = img.width * baseScale, h = img.height * baseScale;
    ctx.drawImage(img, size / 2 - w / 2 + cropOffsetX, size / 2 - h / 2 + cropOffsetY, w, h);
    ctx.restore();
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2 - 1.5, 0, Math.PI * 2);
    ctx.stroke();
  }

  document.getElementById('zoomSlider').addEventListener('input', (e) => {
    cropZoom = Number(e.target.value) / 100;
    drawCropCanvas();
  });
  const cropCanvasEl = document.getElementById('cropCanvas');
  cropCanvasEl.addEventListener('pointerdown', (e) => { cropDragging = true; cropLastX = e.clientX; cropLastY = e.clientY; });
  window.addEventListener('pointerup', () => cropDragging = false);
  window.addEventListener('pointermove', (e) => {
    if (!cropDragging) return;
    cropOffsetX += (e.clientX - cropLastX);
    cropOffsetY += (e.clientY - cropLastY);
    cropLastX = e.clientX; cropLastY = e.clientY;
    drawCropCanvas();
  });

  function confirmCrop() {
    const canvas = document.getElementById('cropCanvas');
    // Export as a modest fixed-size square JPEG — plenty for a small print circle.
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = 400; exportCanvas.height = 400;
    exportCanvas.getContext('2d').drawImage(canvas, 0, 0, 400, 400);
    photoBase64 = exportCanvas.toDataURL('image/jpeg', 0.9).split(',')[1];
    document.getElementById('cropperOverlay').style.display = 'none';
    addBubble('assistant', "Got your photo — I'll use it exactly as you framed it, no edits.");
  }
  function cancelCrop() {
    document.getElementById('cropperOverlay').style.display = 'none';
    cropSourceImage = null;
    awaitingPhotoUpload = true; // let them try attaching a photo again
  }

  // ── Sending messages to cv-chat.js ──────────────────────────────────────
  // ── Turns — one per user input, so "Retry" can resend the EXACT same
  // original input against the conversation state as it was BEFORE that
  // turn, rather than guessing from whatever text is currently on screen.
  let turns = [];

  async function performTurn(turn, idx) {
    pullLogoDownAndAnimate();
    document.getElementById('sendBtn').disabled = true;
    try {
      const res = await fetch('/.netlify/functions/cv-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: currentUserId, // checked again server-side — see cv-chat.js
          messages: turn.beforeMessages,
          newUserText: turn.userText || undefined,
          newUserFiles: turn.userFiles && turn.userFiles.length ? turn.userFiles : undefined,
          photoBase64: turn.photoBase64 || undefined
        })
      });
      const data = await res.json();
      settleLogoMark();

      let replyWrap;
      if (!res.ok || !data.success) {
        replyWrap = addBubble('assistant', 'Sorry, something went wrong: ' + (data.error || 'unknown error'));
      } else {
        conversationMessages = data.messages;
        replyWrap = addBubble('assistant', data.reply || '(no reply)');
        if (data.awaitingPhoto) awaitingPhotoUpload = true;
        if (data.previewPdfBase64) showPdfBar(data.previewPdfBase64, 'Preview ready', 'cv_preview.pdf');
        if (data.finalPdfBase64) showPdfBar(data.finalPdfBase64, 'Your CV is ready 🎉', 'cv_final.pdf');
      }
      turn.assistantWrapEl = replyWrap;
      setRetryHandler(replyWrap, () => retryTurn(idx));

    } catch (e) {
      settleLogoMark();
      const replyWrap = addBubble('assistant', 'Network error — please check your connection and try again.');
      turn.assistantWrapEl = replyWrap;
      setRetryHandler(replyWrap, () => retryTurn(idx));
    } finally {
      document.getElementById('sendBtn').disabled = false;
    }
  }

  // Retrying ANY turn (the user's message or the assistant's reply — both
  // buttons do the same thing) discards that reply and any later turns
  // (their conversation state no longer applies, since we're rewinding to
  // before this turn), then resends the exact same original input fresh.
  async function retryTurn(idx) {
    const turn = turns[idx];
    if (!turn) return;
    for (let i = turns.length - 1; i > idx; i--) {
      if (turns[i].userWrapEl) turns[i].userWrapEl.remove();
      if (turns[i].assistantWrapEl) turns[i].assistantWrapEl.remove();
    }
    turns.length = idx + 1;
    if (turn.assistantWrapEl) { turn.assistantWrapEl.remove(); turn.assistantWrapEl = null; }
    conversationMessages = turn.beforeMessages.slice();
    await performTurn(turn, idx);
  }

  async function sendMessage() {
    const input = document.getElementById('composerInput');
    const text = input.value.trim();
    if (!text && !pendingFiles.length) return;

    const filesToSend = pendingFiles.slice();
    const photoAtSend = photoBase64;
    pendingFiles = [];
    renderPendingFiles();
    input.value = '';
    input.style.height = 'auto';

    // Make sure any still-uploading files have settled (success or failed)
    // before we send, so the sent-message grid shows their real final state.
    for (const f of filesToSend) {
      while (f.status === 'uploading') { await new Promise(r => setTimeout(r, 100)); }
    }
    // Only files that actually finished reading successfully go to the AI —
    // failed ones are shown to the user (marked Failed) but not sent.
    const readyFiles = filesToSend.filter(f => f.status === 'ready');

    const beforeMessages = conversationMessages.slice();
    const userWrapEl = (text || filesToSend.length) ? addBubble('user', text, filesToSend) : null;

    const idx = turns.length;
    const turn = { beforeMessages, userText: text, userFiles: readyFiles, photoBase64: photoAtSend, userWrapEl, assistantWrapEl: null };
    turns.push(turn);
    if (userWrapEl) setRetryHandler(userWrapEl, () => retryTurn(idx));

    await performTurn(turn, idx);
  }

  function showPdfBar(base64, label, filename) {
    const bar = document.getElementById('pdfPreviewBar');
    const blob = base64ToBlob(base64, 'application/pdf');
    const url = URL.createObjectURL(blob);
    document.getElementById('pdfPreviewLabel').textContent = label;
    document.getElementById('pdfPreviewOpenBtn').href = url;
    const dl = document.getElementById('pdfPreviewDownloadBtn');
    dl.href = url;
    dl.setAttribute('download', filename);
    bar.classList.remove('hidden');
  }

  function base64ToBlob(base64, mime) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    return new Blob([new Uint8Array(byteNumbers)], { type: mime });
  }

  // ── Kick off the conversation ────────────────────────────────────────
  if (currentUserId === CV_DEV_ALLOWED_USER_ID) {
    addBubble('assistant', "Hi! I'm CVCase 👋 I'll help you build a clean, one-page CV using the Minimal template. You can tell me about yourself here, or attach a document (old CV, transcript, certificate) and I'll pull details from it. Whenever you're ready, attach a photo too and I'll let you frame it perfectly for this template.");
  }
</script>
</body>
</html>
